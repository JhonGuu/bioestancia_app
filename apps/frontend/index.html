<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      La app ya está en español y no la traducimos nosotros. Le pedimos a
      Chrome/Edge que no la traduzcan tampoco: la traducción automática
      reescribe el DOM por fuera de React y rompe los portales de Radix
      (Select, Dialog, etc.) con "Failed to execute 'removeChild' on 'Node'"
      — bug conocido de Radix, no nuestro (radix-ui/primitives#2578).
    -->
    <meta name="google" content="notranslate" />
    <title>Bioestancia</title>
    <script>
      // Resuelve el tema (guardado en localStorage, o el del sistema si nunca
      // se eligió uno) y le pone la clase "dark" al <html> ANTES de que React
      // pinte nada. Sin esto, la primera carga siempre arranca en claro y
      // "parpadea" a oscuro un instante después si el usuario lo tenía elegido.
      (function () {
        try {
          var stored = localStorage.getItem("bioestancia-theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
